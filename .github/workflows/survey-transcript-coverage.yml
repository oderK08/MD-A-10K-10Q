name: Reconnaissance transcripts (où et sous quel format)

# Sonde une liste de sociétés pour savoir si un pipeline de transcript
# maison vaut le coup, avec des mesures plutôt que des suppositions.
#
# La transcription d'un call est facile et coûte des centimes. Récupérer
# l'audio est le point dur, parce que chaque émetteur héberge son webcast
# ailleurs : soit c'est une poignée d'adaptateurs à écrire, soit c'est un
# travail sans fin, et ça dépend entièrement de la distribution réelle.
# Un run de ce workflow la mesure.
#
# À lancer depuis l'onglet "Actions", bouton "Run workflow".
"on":
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers à sonder, séparés par des virgules (laisser vide = Nasdaq-100 ci-dessous)"
        required: false
        default: ""
      use_nasdaq_100:
        description: "Utiliser la liste Nasdaq-100 du repo (universes/nasdaq100.txt) au lieu du champ ci-dessus"
        required: false
        default: true
        type: boolean
      user_agent:
        description: "User-Agent SEC EDGAR (nom d'app + email de contact, exigé par la SEC)"
        required: false
        default: "EquityAnalyzer/1.0 contact@example.com"

jobs:
  survey:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equity-analyzer
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt || true
          pip install -e .

      - name: Composer la liste de tickers
        id: universe
        # La liste du repo est un fichier de données, pas du code : le
        # champ de saisie l'emporte quand il est rempli, ce qui permet de
        # sonder une watchlist perso sans toucher au dépôt.
        run: |
          if [ -n "${{ inputs.tickers }}" ]; then
            LIST="${{ inputs.tickers }}"
          elif [ "${{ inputs.use_nasdaq_100 }}" = "true" ]; then
            test -f universes/nasdaq100.txt || {
              echo "universes/nasdaq100.txt introuvable dans le dépôt."; exit 1; }
            LIST=$(grep -v '^#' universes/nasdaq100.txt | grep -v '^$' | paste -sd, -)
          else
            LIST=""
          fi
          test -n "$LIST" || { echo "Liste de tickers vide."; exit 1; }
          echo "Liste : $LIST"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

      - name: Sonder chaque société (EDGAR puis site IR)
        env:
          TICKERS: ${{ steps.universe.outputs.list }}
          SEC_USER_AGENT: ${{ inputs.user_agent }}
          IR_USER_AGENT: "EquityAnalyzerSurvey/1.0 (${{ inputs.user_agent }})"
        run: python scripts/survey_transcript_coverage.py

      - name: Publier le tableau de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-transcripts
          path: equity-analyzer/transcript_coverage.csv
          if-no-files-found: ignore

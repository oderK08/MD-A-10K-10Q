name: Test contre la vraie API SEC EDGAR

# Déclenché manuellement depuis l'onglet "Actions" du repo sur github.com
# (bouton "Run workflow") -- aucun terminal nécessaire. Tourne sur les
# serveurs de GitHub, qui ont un accès internet normal, donc peut
# atteindre data.sec.gov contrairement aux sandbox de développement.
"on":
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers à tester, séparés par des virgules (secteurs variés recommandé)"
        required: false
        default: "AAPL,MSFT,GOOGL,AMZN,NVDA,JPM,XOM,JNJ,PG,KO,WMT,DIS,BA,CAT,NFLX"
      user_agent:
        description: "User-Agent SEC EDGAR (nom d'app + email de contact, exigé par la SEC)"
        required: false
        default: "EquityAnalyzer/1.0 contact@example.com"
      use_ai_summary:
        description: "Activer la synthèse IA (Module 6, payant -- nécessite le secret ANTHROPIC_API_KEY)"
        required: false
        default: false
        type: boolean
      ai_model:
        description: "Modèle Claude pour la synthèse IA (sans effet si la case ci-dessus est décochée)"
        required: false
        default: "claude-haiku-4-5-20251001"
        type: choice
        options:
          - "claude-haiku-4-5-20251001"
          - "claude-sonnet-4-5-20250929"

jobs:
  test-real-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equity-analyzer
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt || true
          pip install -e .
          # xhtml2pdf peut entrer en conflit avec un paquet cryptography
          # préinstallé sur certaines images -- filet de sécurité.
          python -c "import xhtml2pdf" || pip install --ignore-installed cryptography xhtml2pdf

      - name: Lancer le pipeline complet contre la vraie API SEC (plusieurs tickers)
        env:
          TICKERS: ${{ inputs.tickers }}
          SEC_USER_AGENT: ${{ inputs.user_agent }}
          # N'est défini QUE si la case "use_ai_summary" est cochée --
          # même si le secret existe dans le repo, un run où la case
          # reste décochée ne fait jamais d'appel payant à l'API Claude.
          ANTHROPIC_API_KEY: ${{ inputs.use_ai_summary && secrets.ANTHROPIC_API_KEY || '' }}
          # Une clé API n'est liée à aucun modèle : le modèle se choisit
          # à chaque appel. Ce champ est donc un choix par run, pas une
          # propriété de la clé.
          ANTHROPIC_MODEL: ${{ inputs.ai_model }}
        run: python scripts/test_real_sec_pipeline.py

      - name: Publier le tableau récapitulatif (résultats par ticker)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-pipeline
          path: equity-analyzer/summary.csv
          if-no-files-found: ignore

      - name: Publier les rapports PDF générés (un par ticker)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-pdf
          path: equity-analyzer/rapports/
          if-no-files-found: ignore

      - name: Publier les diagnostics d'extraction (uniquement pour les échecs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-extraction
          path: equity-analyzer/debug/
          if-no-files-found: ignore

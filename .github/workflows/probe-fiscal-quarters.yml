name: Sonder les trimestres fiscaux (que veut dire `quarter` ?)

# Le paramètre `quarter` d'Alpha Vantage ressemble à une date civile
# (« 2026Q2 ») mais une demande réelle de MSFT 2026Q2 a renvoyé le call
# du trimestre clos en DÉCEMBRE 2025 — le Q2 fiscal de Microsoft. Le
# paramètre suit donc l'exercice de la société.
#
# Sur une watchlist à trois clôtures d'exercice différentes, apparier
# deux trimestres mal traduits ne produit ni plantage ni section vide :
# le rapport compare deux périodes qui n'ont rien à voir et l'affirme
# avec assurance. C'est le pire type de défaut possible ici, et la seule
# parade est de mesurer.
#
# Coûte une requête par ticker.
"on":
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers (vide = universes/watchlist.txt)"
        required: false
        default: ""
      quarter:
        description: "Trimestre demandé, format AAAATN"
        required: false
        default: "2026Q1"

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equity-analyzer
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt || true
          pip install -e .

      - name: Composer la liste
        id: universe
        # Échoue tout de suite si la liste est vide, plutôt que de laisser
        # l'étape suivante s'en plaindre. La première exécution a produit
        # une liste vide parce que universes/watchlist.txt n'était pas
        # suivi par git : le dossier data/ d'où il venait est ignoré par
        # défaut. Le workflow avait l'air de fonctionner jusqu'à un
        # message d'erreur qui accusait le mauvais coupable.
        run: |
          if [ -n "${{ inputs.tickers }}" ]; then
            LIST="${{ inputs.tickers }}"
          else
            test -f universes/watchlist.txt || {
              echo "universes/watchlist.txt introuvable dans le dépôt."; exit 1; }
            LIST=$(grep -v '^#' universes/watchlist.txt | grep -v '^$' | paste -sd, -)
          fi
          test -n "$LIST" || { echo "Liste de tickers vide."; exit 1; }
          echo "Liste : $LIST"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

      - name: Comparer trimestre demandé et trimestre déclaré
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          TICKERS: ${{ steps.universe.outputs.list }}
          PROBE_QUARTER: ${{ inputs.quarter }}
        run: python scripts/probe_fiscal_quarters.py

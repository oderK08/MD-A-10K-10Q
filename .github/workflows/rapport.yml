name: Rapport (un ticker)

# Tu mets un ticker, tu obtiens un seul PDF :
#   page 1  la lecture du dernier earnings call par Claude, écrite contre
#           le consensus sur lequel le trimestre était attendu
#   page 2  la session questions-réponses disséquée : esquives,
#           concessions, signaux prospectifs hors communiqué. Absente
#           quand le transcript n'isole pas de Q&A, auquel cas le
#           document fait deux pages.
#   page 3  les red flags annuels et la tonalité
#
# Le trimestre n'est pas à saisir en mode US. EDGAR sait quel trimestre
# la société vient de déposer et sous quel repère fiscal elle le désigne,
# et c'est le même repère que celui du fournisseur de transcripts, donc
# un déposant à clôture juin ou janvier marche sans rien de particulier.
#
# HORS US (region = International) : il n'y a pas d'EDGAR, donc pas de CIK,
# pas de 10-K et pas de consensus comparable. Le document se réduit aux
# pages 1 et 2 (lecture + Q&A), la page 3 comptable disparaît. Le
# trimestre doit être saisi (quarter), et le transcript déposé à la main
# dans transcripts/TICKER_QUARTER.txt : le fournisseur ne couvre pas ces
# calls et il n'y a pas de calendrier fiscal pour le lui demander.
#
# Secrets nécessaires (Settings > Secrets and variables > Actions) :
#   ANTHROPIC_API_KEY    obligatoire, c'est elle qui écrit la page 1
#   ALPHAVANTAGE_API_KEY transcript et consensus ; sans elle le run se
#                        rabat sur le 8-K de résultats déposé chez SEC,
#                        que seule une minorité d'émetteurs fournit
"on":
  workflow_dispatch:
    inputs:
      ticker:
        description: "Le ticker (ex: AAOI, MSFT, NVDA, COHR)"
        required: true
        default: "AAOI"
      region:
        description: "US (par défaut) ou International (société hors SEC)"
        required: false
        default: "US"
        type: choice
        options:
          - US
          - International
      quarter:
        # Hors US il n'y a pas de dépôt SEC pour déduire le trimestre, il
        # faut donc le donner. C'est aussi le nom du fichier transcript à
        # déposer : transcripts/TICKER_2026Q2.txt. Ignoré en mode US.
        description: "Trimestre fiscal, UNIQUEMENT si International (ex: 2026Q2)"
        required: false
        default: ""
      user_agent:
        description: "User-Agent SEC EDGAR (nom d'app + email, exigé par la SEC)"
        required: false
        default: "EquityAnalyzer/1.0 contact@example.com"
      ai_model:
        description: "Modèle Claude qui lit le call"
        required: false
        default: "claude-sonnet-5"
        type: choice
        options:
          - claude-sonnet-5
          - claude-opus-5
          - claude-haiku-4-5-20251001

jobs:
  rapport:
    runs-on: ubuntu-latest
    # Écrire sur la branche de données, et rien d'autre. Le job ne
    # touche jamais au code : il ne pousse que dans `donnees`.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: equity-analyzer
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Récupérer l'historique des trimestres déjà lus
        # Ce que les runs précédents ont appris : les engagements
        # chiffrés d'un trimestre et les esquives d'une session. Sur une
        # branche à part, pour que l'historique de `main` reste celui du
        # code et qu'un run ne puisse jamais entrer en conflit avec un
        # commit humain.
        #
        # `|| true` parce que la branche n'existe pas avant le premier
        # run, et qu'un premier run n'a par définition pas d'historique.
        # Le script fonctionne sans le répertoire.
        continue-on-error: true
        run: |
          git fetch origin donnees --depth=1 2>/dev/null || true
          if git rev-parse --verify origin/donnees >/dev/null 2>&1; then
            git --work-tree=. checkout origin/donnees -- historique 2>/dev/null || true
            echo "Historique récupéré :"
            find historique -name '*.json' 2>/dev/null | head -20 || true
          else
            echo "Pas encore de branche donnees : premier run."
          fi

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          # xhtml2pdf peut entrer en conflit avec un paquet cryptography
          # préinstallé sans métadonnées pip sur certaines images.
          pip install --ignore-installed cryptography
          pip install -r requirements.txt
          pip install -e .

      - name: Vérifier que la police du rapport est bien résolue
        # La police Lato est maintenant EMBARQUÉE dans le dépôt
        # (src/equity_analyzer/report/assets/fonts), plus installée par
        # apt : apt-get gelait des runs entiers pendant des dizaines de
        # minutes sur les miroirs GitHub. Cette vérification garde son
        # sens comme garde-fou : si un fichier de police disparaissait,
        # xhtml2pdf se rabattrait en silence sur Helvetica. Ça doit
        # échouer fort plutôt que passer inaperçu.
        run: |
          python -c "
          from equity_analyzer.report.fonts import font_face_css
          import sys
          if not font_face_css():
              sys.exit('Police Lato introuvable dans le dépôt (assets/fonts).')
          print('Police du rapport résolue depuis le dépôt.')
          "

      - name: Lancer la suite de tests
        # Entièrement hors-ligne (fixtures locales), donc c'est un vrai
        # garde-fou avant de dépenser du quota et un appel payant.
        run: python -m pytest tests/ -q

      - name: Générer le rapport
        env:
          TICKER: ${{ inputs.ticker }}
          REGION: ${{ inputs.region }}
          QUARTER: ${{ inputs.quarter }}
          SEC_USER_AGENT: ${{ inputs.user_agent }}
          ANTHROPIC_MODEL: ${{ inputs.ai_model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python scripts/rapport.py

      - name: Conserver ce que ce run a produit
        # Trois choses poussées sur `donnees`, une branche à part de
        # `main` pour que l'historique du code reste celui du code :
        #
        #   historique/  les engagements et esquives structurés, qui
        #                transforment un instantané en série (base de
        #                comparaison gratuite au trimestre suivant).
        #   rapports/    les PDF eux-mêmes, archivés pour de bon plutôt
        #                que perdus avec l'artefact du run qui expire.
        #   rapports/*.json  le jumeau machine de chaque PDF, la matière
        #                d'une analyse sectorielle (on ne raisonne pas
        #                sur des PDF ; on charge des JSON).
        #
        # `if: always()` : un run qui échoue après avoir produit quelque
        # chose l'a payé, le jeter obligerait à le repayer.
        # `continue-on-error` : c'est un sous-produit, un conflit de push
        # contre un run parallèle ne doit pas rendre le run rouge.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if [ -z "$(find historique rapports -type f 2>/dev/null)" ]; then
            echo "Rien de nouveau à conserver."
            exit 0
          fi

          # DANS UN CLONE À PART, jamais dans l'arbre de travail courant.
          # Basculer celui-ci sur `donnees` remplacerait son contenu et
          # effacerait rapports/ et transcripts/ avant l'étape de
          # publication qui suit.
          src="$(pwd)"
          work="$(mktemp -d)"
          cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch -q --depth=1 origin donnees 2>/dev/null; then
            git checkout -q -B donnees FETCH_HEAD
          else
            # Branche orpheline : les données n'ont pas à traîner
            # l'historique du code derrière elles.
            echo "Première écriture : création de la branche donnees."
            git checkout -q --orphan donnees
          fi

          mkdir -p equity-analyzer/historique equity-analyzer/rapports
          [ -d "$src/historique" ] && cp -r "$src/historique/." equity-analyzer/historique/ || true
          [ -d "$src/rapports" ] && cp -r "$src/rapports/." equity-analyzer/rapports/ || true
          git add -A equity-analyzer/historique equity-analyzer/rapports
          if git diff --cached --quiet; then
            echo "Rien de neuf à pousser."
            exit 0
          fi
          git commit -q -m "Rapport et historique ${{ inputs.ticker }} (run ${{ github.run_number }})"

          # La course perdue contre un run parallèle est un cas normal,
          # pas une erreur : deux tickers analysés en même temps écrivent
          # dans des répertoires différents, donc un rebase suffit.
          for attempt in 1 2 3; do
            if git push -q origin donnees; then
              echo "Rapport et historique poussés sur donnees."
              exit 0
            fi
            echo "Push refusé, rebase et nouvelle tentative ($attempt/3)."
            git fetch -q --depth=1 origin donnees || true
            git rebase origin/donnees || git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Historique non poussé : un autre run a probablement gagné la course."

      - name: Publier le rapport
        # `if: always()` parce qu'un run qui échoue APRÈS avoir récupéré
        # le transcript a quand même produit quelque chose qui vaut le
        # quota dépensé : le cache. Le relancer ne recoûtera rien.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-${{ inputs.ticker }}
          path: |
            equity-analyzer/rapports/
            equity-analyzer/transcripts/
          if-no-files-found: warn
